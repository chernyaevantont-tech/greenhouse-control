version: "3.9"

# ──────────────────────────────────────────────
# Shared environment variables
# ──────────────────────────────────────────────
x-common-env: &common-env
  START_DATE: "2010-02-28"
  N_DAYS: "60"
  PERIOD: "900"
  MPC_HORIZON: "20"

services:

  # ─── 1. SINDy Bootstrap (runs once, then exits) ────
  sindy_bootstrap:
    build: .
    container_name: sindy_bootstrap
    command: python -m greenhouse_mvp.sindy_pipeline.bootstrap
    environment:
      <<: *common-env
      MODEL_PATH: /app/models/sindy_model.pkl
      SEASON_LENGTH: "60"
      SINDY_THRESHOLD: "0.05"
      SINDY_ALPHA: "0.01"
    volumes:
      - model_store:/app/models
    networks:
      - greenhouse_net
    restart: "no"

  # ─── 2. API Server (FastAPI – simulation + control) ────
  api_server:
    build: .
    container_name: api_server
    command: python -m greenhouse_mvp.api.server
    environment:
      <<: *common-env
      SINDY_MODEL_PATH: /app/models/sindy_model.pkl
      MAX_RETRIES: "2"
      RETRAIN_INTERVAL: "96"
      LLM_BACKEND: "${LLM_BACKEND:-openai}"
      LLM_MODEL: "${LLM_MODEL:-gpt-4o-mini}"
      AGENT_ENABLED_DEFAULT: "${AGENT_ENABLED_DEFAULT:-false}"
      CONTROLLER_MODE: "${CONTROLLER_MODE:-mpc}"
      LLM_CALL_INTERVAL: "${LLM_CALL_INTERVAL:-4}"
      LLM_TIMEOUT: "${LLM_TIMEOUT:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
    volumes:
      - model_store:/app/models
    ports:
      - "8000:8000"
    depends_on:
      sindy_bootstrap:
        condition: service_completed_successfully
    networks:
      - greenhouse_net
    restart: on-failure

  # ─── 3. Dashboard (React + nginx) ──────────────────────
  dashboard:
    build: ./dashboard
    container_name: dashboard
    ports:
      - "8080:8080"
    depends_on:
      api_server:
        condition: service_started
    networks:
      - greenhouse_net
    restart: unless-stopped

# ──────────────────────────────────────────────
networks:
  greenhouse_net:
    driver: bridge

volumes:
  model_store:
