<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Greenhouse Control — Live Dashboard</title>
  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --green: #3fb950;
      --yellow: #d29922;
      --red: #f85149;
      --blue: #58a6ff;
      --purple: #bc8cff;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 20px; font-weight: 600; }
    header span.subtitle { color: var(--muted); font-size: 13px; }

    #status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--red);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    #status-dot.connected { background: var(--green); }

    .metrics-bar {
      display: flex;
      gap: 12px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 18px;
      min-width: 130px;
      flex: 1;
    }
    .metric-card .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
    .metric-card .value { font-size: 22px; font-weight: 600; margin-top: 4px; }
    .metric-card .delta { font-size: 12px; margin-top: 2px; }
    .delta.pos { color: var(--green); }
    .delta.neg { color: var(--red); }
    .delta.neutral { color: var(--muted); }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 16px;
      padding: 16px 24px;
    }

    .charts-col { display: flex; flex-direction: column; gap: 16px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }
    .card h2 {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .6px;
      margin-bottom: 12px;
    }

    canvas { width: 100% !important; }

    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: all .2s;
    }
    .tab-btn.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Actuator bars */
    .actuator-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .actuator-row { }
    .actuator-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 4px;
      color: var(--muted);
    }
    .actuator-label span:last-child { color: var(--text); font-weight: 600; }
    .bar-bg {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 3px;
      background: var(--blue);
      transition: width .4s ease;
    }

    /* OOD */
    #ood-gauge-wrap { text-align: center; margin-bottom: 8px; }
    #ood-value { font-size: 36px; font-weight: 700; }
    #ood-label { font-size: 12px; color: var(--muted); }
    #ood-status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 6px;
    }
    #ood-status.safe { background: rgba(63,185,80,.15); color: var(--green); }
    #ood-status.ood  { background: rgba(248,81,73,.15);  color: var(--red); }

    /* Supervisor log */
    #supervisor-log { max-height: 280px; overflow-y: auto; }
    .log-entry {
      border-bottom: 1px solid var(--border);
      padding: 8px 0;
      font-size: 12px;
    }
    .log-entry:last-child { border-bottom: none; }
    .log-entry .log-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
    }
    .log-entry .step { color: var(--muted); }
    .badge {
      padding: 1px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge.APPROVE  { background: rgba(63,185,80,.15); color: var(--green); }
    .badge.OVERRIDE { background: rgba(210,153,34,.15); color: var(--yellow); }
    .badge.REJECT   { background: rgba(248,81,73,.15);  color: var(--red); }
    .log-entry .reason { color: var(--muted); }

    #no-data { color: var(--muted); font-size: 13px; text-align: center; padding: 24px 0; }

    .right-col { display: flex; flex-direction: column; gap: 16px; }

    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <div id="status-dot"></div>
  <h1>🌱 Greenhouse Control</h1>
  <span class="subtitle">Live Dashboard</span>
  <span style="margin-left:auto;color:var(--muted);font-size:12px;">Step: <b id="hdr-step">—</b></span>
</header>

<div class="metrics-bar">
  <div class="metric-card">
    <div class="label">Indoor Temp</div>
    <div class="value" id="m-tin">—</div>
    <div class="delta neutral" id="m-tin-d">setpoint 20 °C</div>
  </div>
  <div class="metric-card">
    <div class="label">CO₂</div>
    <div class="value" id="m-co2">—</div>
    <div class="delta neutral" id="m-co2-d">setpoint 800 ppm</div>
  </div>
  <div class="metric-card">
    <div class="label">Humidity</div>
    <div class="value" id="m-rh">—</div>
    <div class="delta neutral" id="m-rh-d">max 85 %</div>
  </div>
  <div class="metric-card">
    <div class="label">Outdoor Temp</div>
    <div class="value" id="m-tout">—</div>
    <div class="delta neutral" id="m-tout-d">&nbsp;</div>
  </div>
  <div class="metric-card">
    <div class="label">Solar Rad</div>
    <div class="value" id="m-rad">—</div>
    <div class="delta neutral">&nbsp;</div>
  </div>
</div>

<div class="main-grid">
  <div class="charts-col">

    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" data-tab="thermo">Thermodynamics</button>
        <button class="tab-btn" data-tab="actuators">Actuators</button>
      </div>

      <div class="tab-panel active" id="tab-thermo">
        <canvas id="chart-temp" height="130"></canvas>
        <canvas id="chart-co2"  height="100" style="margin-top:12px;"></canvas>
      </div>

      <div class="tab-panel" id="tab-actuators">
        <div class="actuator-grid" id="actuator-bars"></div>
      </div>
    </div>

    <div class="card">
      <h2>OOD Distance (Mahalanobis)</h2>
      <canvas id="chart-ood" height="100"></canvas>
    </div>

  </div>

  <div class="right-col">

    <div class="card">
      <h2>OOD Monitor</h2>
      <div id="ood-gauge-wrap">
        <div id="ood-value">—</div>
        <div id="ood-label">Mahalanobis distance</div>
        <div id="ood-status" class="safe">IN DISTRIBUTION</div>
      </div>
    </div>

    <div class="card" style="flex:1">
      <h2>Supervisor Decisions</h2>
      <div id="supervisor-log"><div id="no-data">Waiting for decisions…</div></div>
    </div>

  </div>
</div>

<script>
// ─── Config ────────────────────────────────────────────────────────────────
const MQTT_WS_URL = `ws://${location.hostname}:9001`;
const WINDOW      = 120;

// ─── State ─────────────────────────────────────────────────────────────────
// Each array is kept separate; Chart.js gets a NEW array reference on every
// update to guarantee re-render (avoids stale-reference issues).
let steps = [], t_in = [], T_out = [], co2 = [], rh = [];
let uBoil=[], uCO2=[], uThScr=[], uVent=[], uLamp=[], uBlScr=[];
let mahal = [], oodThreshold = 3.0;
const MAX_LOG = 50;
const supervisorLog = [];

function push(arr, val) {
  arr.push(val);
  if (arr.length > WINDOW) arr.shift();
}

// ─── Chart helpers ─────────────────────────────────────────────────────────
Chart.defaults.color = '#8b949e';
Chart.defaults.borderColor = '#30363d';

function mkLine(label, data, color, fill = false) {
  return {
    label, data,
    borderColor: color,
    backgroundColor: fill ? color + '33' : 'transparent',
    borderWidth: 2,
    pointRadius: 0,
    tension: 0.3,
    fill,
  };
}

// OOD threshold — drawn as a flat dataset so no plugin needed
function mkThresholdDataset(n, value) {
  return {
    label: `threshold (${value})`,
    data: Array(n).fill(value),
    borderColor: '#f85149',
    borderWidth: 1,
    borderDash: [4, 4],
    pointRadius: 0,
    fill: false,
    tension: 0,
  };
}

// ─── Charts ────────────────────────────────────────────────────────────────
const tempChart = new Chart(document.getElementById('chart-temp'), {
  type: 'line',
  data: {
    labels: [],
    datasets: [
      mkLine('t_in (°C)',  [], '#58a6ff', true),
      mkLine('T_out (°C)', [], '#bc8cff'),
    ],
  },
  options: {
    animation: false,
    plugins: { legend: { position: 'top', labels: { boxWidth: 12 } } },
    scales: {
      x: { ticks: { maxTicksLimit: 8 } },
      y: { title: { display: true, text: '°C' } },
    },
  },
});

const co2Chart = new Chart(document.getElementById('chart-co2'), {
  type: 'line',
  data: {
    labels: [],
    datasets: [ mkLine('CO₂ (ppm)', [], '#3fb950', true) ],
  },
  options: {
    animation: false,
    plugins: { legend: { position: 'top', labels: { boxWidth: 12 } } },
    scales: {
      x: { ticks: { maxTicksLimit: 8 } },
      y: { title: { display: true, text: 'ppm' } },
    },
  },
});

const oodChart = new Chart(document.getElementById('chart-ood'), {
  type: 'line',
  data: {
    labels: [],
    datasets: [
      mkLine('Mahalanobis', [], '#d29922', true),
      mkThresholdDataset(0, 3.0),
    ],
  },
  options: {
    animation: false,
    plugins: { legend: { display: false } },
    scales: { x: { ticks: { maxTicksLimit: 8 } }, y: { min: 0 } },
  },
});

function refreshCharts() {
  // Assign new array copies so Chart.js always detects a change
  tempChart.data.labels          = [...steps];
  tempChart.data.datasets[0].data = [...t_in];
  tempChart.data.datasets[1].data = [...T_out];
  tempChart.update('none');

  co2Chart.data.labels           = [...steps];
  co2Chart.data.datasets[0].data = [...co2];
  co2Chart.update('none');

  oodChart.data.labels           = [...steps];
  oodChart.data.datasets[0].data = [...mahal];
  oodChart.data.datasets[1].data = Array(steps.length).fill(oodThreshold);
  oodChart.update('none');
}

// ─── Actuator bars ─────────────────────────────────────────────────────────
const ACTUATORS = [
  { key: 'uBoil',  label: 'Boiler',         color: '#f85149' },
  { key: 'uCO2',   label: 'CO₂ inject',     color: '#3fb950' },
  { key: 'uThScr', label: 'Thermal screen', color: '#58a6ff' },
  { key: 'uVent',  label: 'Ventilation',    color: '#bc8cff' },
  { key: 'uLamp',  label: 'Lamps',          color: '#d29922' },
  { key: 'uBlScr', label: 'Blackout scr',   color: '#8b949e' },
];

const barsEl = document.getElementById('actuator-bars');
ACTUATORS.forEach(a => {
  barsEl.innerHTML += `
    <div class="actuator-row">
      <div class="actuator-label"><span>${a.label}</span><span id="aval-${a.key}">0.000</span></div>
      <div class="bar-bg"><div class="bar-fill" id="abar-${a.key}" style="width:0%;background:${a.color}"></div></div>
    </div>`;
});

function updateActuators(p) {
  ACTUATORS.forEach(a => {
    const v = p[a.key] ?? 0;
    document.getElementById(`aval-${a.key}`).textContent = v.toFixed(3);
    document.getElementById(`abar-${a.key}`).style.width = (Math.min(v, 1) * 100).toFixed(1) + '%';
  });
}

// ─── Metrics ───────────────────────────────────────────────────────────────
function setMetric(id, val, unit, deltaId, ref, refLabel) {
  document.getElementById(id).textContent = val.toFixed(1) + ' ' + unit;
  if (deltaId) {
    const d = val - ref;
    const el = document.getElementById(deltaId);
    el.textContent = (d >= 0 ? '+' : '') + d.toFixed(1) + ' vs ' + refLabel;
    el.className = 'delta ' + (Math.abs(d) < 0.5 ? 'neutral' : d > 0 ? 'pos' : 'neg');
  }
}

// ─── Supervisor log ─────────────────────────────────────────────────────────
function renderLog() {
  const el = document.getElementById('supervisor-log');
  if (!supervisorLog.length) return;
  document.getElementById('no-data')?.remove();
  el.innerHTML = supervisorLog.map(e => `
    <div class="log-entry">
      <div class="log-header">
        <span class="step">Step ${e.step}</span>
        <span class="badge ${e.decision}">${e.decision}</span>
        <span style="margin-left:auto;color:var(--muted);font-size:11px;">${((e.confidence??0)*100).toFixed(0)}%</span>
      </div>
      <div class="reason">${e.reason ?? ''}</div>
    </div>`).join('');
}

// ─── MQTT ──────────────────────────────────────────────────────────────────
const dot = document.getElementById('status-dot');

function connect() {
  const client = mqtt.connect(MQTT_WS_URL, {
    clientId: 'gh_dash_' + Math.random().toString(16).slice(2),
    reconnectPeriod: 3000,
    keepalive: 30,
  });

  client.on('connect', () => {
    dot.classList.add('connected');
    ['greenhouse/telemetry', 'greenhouse/action/approved',
     'greenhouse/ood/metrics', 'greenhouse/supervisor/verdict'].forEach(t =>
      client.subscribe(t, { qos: 1 })
    );
  });
  client.on('disconnect', () => dot.classList.remove('connected'));
  client.on('error',      () => dot.classList.remove('connected'));

  client.on('message', (topic, raw) => {
    let p;
    try { p = JSON.parse(raw.toString()); } catch { return; }

    if (topic === 'greenhouse/telemetry') {
      push(steps, p.step);
      push(t_in,  p.t_in);
      push(T_out, p.T_out);
      push(co2,   p.co2);
      push(rh,    p.rh);

      document.getElementById('hdr-step').textContent = p.step;
      setMetric('m-tin',  p.t_in,  '°C',  'm-tin-d',  20,  '20 °C');
      setMetric('m-co2',  p.co2,   'ppm', 'm-co2-d',  800, '800 ppm');
      setMetric('m-rh',   p.rh,    '%',   'm-rh-d',   85,  '85 %');
      setMetric('m-tout', p.T_out, '°C',  null);
      document.getElementById('m-rad').textContent = (p.rad ?? 0).toFixed(0) + ' W/m²';

      refreshCharts();
    }

    if (topic === 'greenhouse/action/approved') {
      push(uBoil,  p.uBoil  ?? 0); push(uCO2,   p.uCO2   ?? 0);
      push(uThScr, p.uThScr ?? 0); push(uVent,  p.uVent  ?? 0);
      push(uLamp,  p.uLamp  ?? 0); push(uBlScr, p.uBlScr ?? 0);
      updateActuators(p);
    }

    if (topic === 'greenhouse/ood/metrics') {
      push(mahal, p.mahalanobis_distance ?? 0);
      oodThreshold = p.threshold_used ?? 3.0;

      document.getElementById('ood-value').textContent =
        (p.mahalanobis_distance ?? 0).toFixed(2);
      const st = document.getElementById('ood-status');
      if (p.in_distribution) {
        st.textContent = 'IN DISTRIBUTION'; st.className = 'ood-status safe';
      } else {
        st.textContent = 'OUT OF DISTRIBUTION'; st.className = 'ood-status ood';
      }
      // OOD chart will be refreshed on next telemetry tick; force it now too
      oodChart.data.labels            = [...steps];
      oodChart.data.datasets[0].data  = [...mahal];
      oodChart.data.datasets[1].data  = Array(steps.length).fill(oodThreshold);
      oodChart.update('none');
    }

    if (topic === 'greenhouse/supervisor/verdict') {
      supervisorLog.unshift(p);
      if (supervisorLog.length > MAX_LOG) supervisorLog.pop();
      renderLog();
    }
  });
}

connect();

// ─── Tabs ──────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});
</script>
</body>
</html>
