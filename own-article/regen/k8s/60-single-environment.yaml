# SHELVED 2026-09-16 (see CLUSTER_REGEN_PLAN.md): kept for a possible revision round, never applied.
# Single-environment regeneration (decision of 2026-09-16): every wave the manuscript reads
# that was produced on the workstation (image == "local") is re-run on the cluster, so the
# whole results tree comes from one platform. The canonical blocks of final/ (main,
# mechanism, faults, design, parity, ladder, draws) are already cluster-produced and are
# NOT re-run here.
#
# Prerequisites (see CLUSTER_REGEN_PLAN.md):
#   1. image greenhouse-regen:v5 built from the CURRENT tree (the v1..v4 images predate the
#      notuboil library, the --objective flag and the horizon/budget overrides) and pushed
#      to the admin-01 registry; own-article/cluster/weather/Rostov-on-Don/ must hold
#      2014..2023 (make_weather.py --years 2014,2015,2016,2017) before the build, because
#      the nodes have no internet and the unseen-season wave needs those four years.
#   2. the smoke job of 10-smoke.yaml rebuilt against v5 and its gate output read.
#   3. results are written to per-wave directories under /results so that the pull lands
#      them where figures/_plotstyle.py and the verifiers already look; each wave is then
#      merged into the single file name those loaders expect (plan, step 6).
#
# Every wave shards round-robin by seed (completions = number of seeds). Tags reproduce
# the file names of the workstation waves so the dedup key and the loaders are unchanged.
---
# --- the priced pool: five SINDy controllers, 20 seeds x 4 seasons ------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: regen-priced-main
  namespace: greenhouse-regen
  labels: { app: greenhouse-regen, wave: priced-main }
spec:
  completionMode: Indexed
  completions: 20
  parallelism: 20
  backoffLimit: 6
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: { app: greenhouse-regen, wave: priced-main }
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: docker.io/agro/greenhouse-regen:v5
          imagePullPolicy: IfNotPresent
          workingDir: /app/own-article/regen
          command: ["sh", "-c"]
          args:
            - >
              python run_regen.py --experiment main --objective priced
              --shard-index "$JOB_COMPLETION_INDEX" --num-shards 20
              --controllers sindy_mpc_conf,sindy_mpc_dense,sindy_mpc_lowthr,sindy_mpc_raw,sindy_mpc_raw_ens
              --tag "priced${JOB_COMPLETION_INDEX}" --out /results/priced_main
          env:
            - { name: OMP_NUM_THREADS, value: "1" }
            - { name: REGEN_IMAGE, value: "greenhouse-regen:v5" }
          resources:
            requests: { cpu: "2", memory: 4Gi }
            limits: { cpu: "4", memory: 8Gi }
          volumeMounts: [{ name: results, mountPath: /results }]
      volumes:
        - name: results
          persistentVolumeClaim: { claimName: regen-results }
