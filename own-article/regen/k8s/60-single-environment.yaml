  labels: { app: greenhouse-regen, wave: guard-draws }
spec:
  completionMode: Indexed
  completions: 20
  parallelism: 20
  backoffLimit: 6
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: { app: greenhouse-regen, wave: guard-draws }
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: docker.io/agro/greenhouse-regen:v5
