---
# RL wave. SAC pre-allocates a 200k-step replay buffer -> the memory request. Add
# nvidia.com/gpu to requests AND limits (equal, integer) and drop parallelism to the GPU
# quota if you want the accelerated path; the workload is CPU-viable either way.
apiVersion: batch/v1
kind: Job
metadata:
  name: regen-main-rl
  namespace: greenhouse-regen
  labels: { app: greenhouse-regen, wave: rl }
spec:
  completionMode: Indexed
  completions: 20
  parallelism: 10
  backoffLimit: 6
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: { app: greenhouse-regen, wave: rl }
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: docker.io/agro/greenhouse-regen:v1
          imagePullPolicy: IfNotPresent
          workingDir: /app/own-article/regen
          command: ["sh", "-c"]
          args:
            - >
              python run_regen.py --experiment main
              --shard-index "$JOB_COMPLETION_INDEX" --num-shards 20
              --controllers ppo,sac
              --tag "rl${JOB_COMPLETION_INDEX}" --out /results/raw
          env:
            - { name: OMP_NUM_THREADS, value: "1" }
            - { name: REGEN_IMAGE, value: "greenhouse-regen:v1" }
          resources:
            requests: { cpu: "2", memory: 6Gi }
            limits: { cpu: "4", memory: 10Gi }
          volumeMounts: [{ name: results, mountPath: /results }]
      volumes:
        - name: results
          persistentVolumeClaim: { claimName: regen-results }
---
# Oracle wave -- the long pole. activeDeadlineSeconds is generous because horizon 20 with a
# 100-failure budget can no longer bail out early the way the horizon-12/10-failure setup did.
apiVersion: batch/v1
kind: Job
metadata:
  name: regen-main-oracle
  namespace: greenhouse-regen
  labels: { app: greenhouse-regen, wave: oracle }
spec:
  completionMode: Indexed
  completions: 20
  parallelism: 20
  backoffLimit: 6
  activeDeadlineSeconds: 172800
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: { app: greenhouse-regen, wave: oracle }
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: docker.io/agro/greenhouse-regen:v1
          imagePullPolicy: IfNotPresent
          workingDir: /app/own-article/regen
          command: ["sh", "-c"]
          args:
            - >
              python run_regen.py --experiment main
              --shard-index "$JOB_COMPLETION_INDEX" --num-shards 20
              --controllers oracle_mpc
              --tag "oracle${JOB_COMPLETION_INDEX}" --out /results/raw
          env:
            - { name: OMP_NUM_THREADS, value: "1" }
            - { name: REGEN_IMAGE, value: "greenhouse-regen:v1" }
          resources:
            requests: { cpu: "2", memory: 4Gi }
            limits: { cpu: "4", memory: 8Gi }
          volumeMounts: [{ name: results, mountPath: /results }]
      volumes:
        - name: results
          persistentVolumeClaim: { claimName: regen-results }
